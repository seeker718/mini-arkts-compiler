<style>
  :root { --bg:#0f1420; --fg:#e6edf3; --muted:#8b98a9; --line:#2c3648; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0;
           background:var(--bg); z-index:2; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .meta { color:var(--muted); font-size:12px; }
  .tools { margin-left:auto; display:flex; gap:8px; }
  input, button { background:#1a2231; color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:6px 10px; font-size:12px; }
  button { cursor:pointer; }
  button:hover { border-color:#4d7cfe; }
  #stage { padding:20px; overflow:auto; }
  svg { display:block; }
  .node rect { rx:8; ry:8; }
  .node .title { font-size:13px; font-weight:600; }
  .node .attr { font-size:11px; fill:var(--muted); }
  .edge { stroke:var(--line); fill:none; }
  .node.dim { opacity:0.15; }
  .node.hit rect { stroke:#4d7cfe; stroke-width:2px; }
  footer { padding:10px 20px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
  pre.src { background:#151b28; border:1px solid var(--line); border-radius:8px;
            padding:12px; color:#c9d4e4; font-size:12px; overflow:auto; }
</style>
</head>
<body>
<header>

  <span class="meta" id="meta"></span>
  <div class="tools">
    <input id="search" type="text" placeholder="搜索节点类型或字段..." />
    <button id="expand">全部展开</button>
    <button id="collapse">折叠到 2 层</button>
  </div>
</header>
<div id="stage"></div>
<footer>Mini-ArkTS 编译器 · 实验一 AST 可视化 · 生成时间 —</footer>
<script>
const AST = {"type": "Program", "line": 1, "column": 1, "body": [{"type": "ClassDeclaration", "line": 6, "column": 1, "kind": "struct", "name": "Counter", "extends": null, "implements": [], "members": [{"type": "FieldDeclaration", "line": 7, "column": 10, "name": "count", "type_annotation": {"type": "TypeAnnotation", "line": 7, "column": 17, "name": "number", "type_args": [], "is_array": false}, "init": {"type": "Literal", "line": 7, "column": 26, "value": 0, "raw": "0", "literal_type": "number"}, "decorators": [{"type": "Decorator", "line": 7, "column": 3, "name": "State", "arguments": []}], "modifiers": []}, {"type": "FieldDeclaration", "line": 8, "column": 9, "name": "step", "type_annotation": {"type": "TypeAnnotation", "line": 8, "column": 15, "name": "number", "type_args": [], "is_array": false}, "init": {"type": "Literal", "line": 8, "column": 24, "value": 1, "raw": "1", "literal_type": "number"}, "decorators": [{"type": "Decorator", "line": 8, "column": 3, "name": "Prop", "arguments": []}], "modifiers": []}, {"type": "MethodDeclaration", "line": 10, "column": 3, "name": "increment", "params": [{"type": "Parameter", "line": 10, "column": 13, "name": "step", "type_annotation": {"type": "TypeAnnotation", "line": 10, "column": 19, "name": "number", "type_args": [], "is_array": false}, "default": null, "rest": false}], "return_type": {"type": "TypeAnnotation", "line": 10, "column": 28, "name": "void", "type_args": [], "is_array": false}, "body": {"type": "Block", "line": 10, "column": 33, "body": [{"type": "ExpressionStatement", "line": 11, "column": 5, "expression": {"type": "AssignmentExpression", "line": 11, "column": 5, "operator": "=", "left": {"type": "MemberExpression", "line": 11, "column": 5, "object": {"type": "ThisExpression", "line": 11, "column": 5}, "property": {"type": "Identifier", "line": 11, "column": 10, "name": "count"}, "computed": false}, "right": {"type": "BinaryExpression", "line": 11, "column": 18, "operator": "+", "left": {"type": "Member nStatement", "line": 20, "column": 11, "expression": {"type": "CallExpression", "line": 20, "column": 11, "callee": {"type": "MemberExpression", "line": 20, "column": 11, "object": {"type": "ThisExpression", "line": 20, "column": 11}, "property": {"type": "Identifier", "line": 20, "column": 16, "name": "increment"}, "computed": false}, "arguments": [{"type": "MemberExpression", "line": 20, "column": 26, "object": {"type": "ThisExpression", "line": 20, "column": 26}, "property": {"type": "Identifier", "line": 20, "column": 31, "name": "step"}, "computed": false}]}}]}, "is_expression": false}]}}, {"type": "IfStatement", "line": 22, "column": 7, "test": {"type": "BinaryExpression", "line": 22, "column": 11, "operator": ">", "left": {"type": "MemberExpression", "line": 22, "column": 11, "object": {"type": "ThisExpression", "line": 22, "column": 11}, "property": {"type": "Identifier", "line": 22, "column": 16, "name": "count"}, "computed": false}, "right": {"type": "Literal", "line": 22, "column": 24, "value": 10, "raw": "10", "literal_type": "number"}}, "consequent": {"type": "Block", "line": 22, "column": 28, "body": [{"type": "ExpressionStatement", "line": 23, "column": 9, "expression": {"type": "CallExpression", "line": 23, "column": 9, "callee": {"type": "Identifier", "line": 23, "column": 9, "name": "Text"}, "arguments": [{"type": "Literal", "line": 23, "column": 14, "value": "Big", "raw": "'Big'", "literal_type": "string"}]}}]}, "alternate": {"type": "Block", "line": 24, "column": 14, "body": [{"type": "ExpressionStatement", "line": 25, "column": 9, "expression": {"type": "CallExpression", "line": 25, "column": 9, "callee": {"type": "Identifier", "line": 25, "column": 9, "name": "Text"}, "arguments": [{"type": "Literal", "line": 25, "column": 14, "value": "Small", "raw": "'Small'", "literal_type": "string"}]}}]}}]}]}, "decorators": [], "modifiers": []}], "decorators": [{"type": "Decorator", "line": 4, "column": 1, "name": "Entry", "arguments": []}, {"type": "Decorator", "line": 5, "column": 1, "name": "Component", "arguments": []}]}]};
const SOURCE = "// samples/counter.ets\n// 计数器组件：@State 状态、方法、模板字符串、if-else、箭头函数\n\n@Entry\n@Component\nstruct Counter {\n  @State count: number = 0;\n  @Prop step: number = 1;\n\n  increment(step: number): void {\n    this.count = this.count + step;\n  }\n\n  build() {\n    Column() {\n      Text(`Count: ${this.count}`)\n        .fontSize(20)\n      Button('+1')\n        .onClick(() => {\n          this.increment(this.step);\n        })\n      if (this.count > 10) {\n        Text('Big')\n      } else {\n        Text('Small')\n      }\n    }\n  }\n}";

const NODE_W = 190, GAP_X = 34, LEVEL_H = 92, PAD = 30;
const COLLAPSED_H = 46;

const CATEGORY = (t) => {
  if (t.endsWith('Declaration')) return {fill:'#16351f', stroke:'#3fb950', text:'#7ee787'};
  if (t.endsWith('Statement') || t === 'Block' || t === 'Program')
    return {fill:'#3a2a12', stroke:'#d29922', text:'#e3b341'};
  if (t.endsWith('Expression') || t === 'Identifier' || t === 'Property')
    return {fill:'#12233f', stroke:'#58a6ff', text:'#79c0ff'};
  if (t === 'Literal' || t === 'TypeAnnotation' || t === 'Decorator' || t === 'Parameter')
    return {fill:'#2b1e3a', stroke:'#a371f7', text:'#d2a8ff'};
  if (t === 'UiContainer') return {fill:'#3a1520', stroke:'#f778ba', text:'#ff9bce'};
  return {fill:'#1c2431', stroke:'#30363d', text:'#c9d1d9'};
};

function isAstNode(o) { return o && typeof o === 'object' && !Array.isArray(o) && typeof o.type === 'string'; }

function build(node) {
  const label = node.type;
  const attrs = [];
  const children = [];
  for (const k of Object.keys(node)) {
    if (k === 'type' || k === 'line' || k === 'column') continue;
    const v = node[k];
    if (Array.isArray(v)) {
      for (const item of v) {
        if (isAstNode(item)) children.push(build(item));
        else attrs.push(k + '=[' + v.length + ']');
      }
    } else if (isAstNode(v)) {
      children.push(build(v));
    } else if (v !== null && v !== '' && v !== undefined) {
      attrs.push(k + '=' + JSON.stringify(v));
    }
  }
  const loc = 'L' + node.line + ':' + node.column;
  return { label, attrs, loc, children };
}

function visibleChildren(n) {
  return n.collapsed ? [] : n.children;
}

function layout(root) {
  let cursor = 0;
  let maxDepth = 0;
  (function walk(n, depth) {
    n.depth = depth;
    maxDepth = Math.max(maxDepth, depth);
    n.height = COLLAPSED_H + (n.collapsed ? 0 : n.attrs.length * 15 + 8);
    const kids = visibleChildren(n);
    if (kids.length === 0) {
      n.x = cursor;
      cursor += NODE_W + GAP_X;
    } else {
      kids.forEach(c => walk(c, depth + 1));
      n.x = (kids[0].x + kids[kids.length - 1].x) / 2;
    }
  })(root, 0);
  return maxDepth;
}

function render() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const root = build(AST);
  const maxDepth = layout(root);

  let maxX = 0;
  (function scan(n) { maxX = Math.max(maxX, n.x); visibleChildren(n).forEach(scan); })(root);

  const width = maxX + NODE_W + PAD * 2;
  const height = maxDepth * LEVEL_H + 160;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);

  const nodes = [];
  const edges = [];

  function emit(n) {
    nodes.push(n);
    for (const c of visibleChildren(n)) {
      edges.push([n, c]);
      emit(c);
    }
  }
  emit(root);

  for (const [p, c] of edges) {
    const x1 = p.x + PAD + NODE_W / 2, y1 = p.depth * LEVEL_H + PAD + p.height;
    const x2 = c.x + PAD + NODE_W / 2, y2 = c.depth * LEVEL_H + PAD;
    const mid = (y1 + y2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'edge');
    path.setAttribute('d', `M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`);
    svg.appendChild(path);
  }

  for (const n of nodes) {
    const c = CATEGORY(n.label);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node');
    g.setAttribute('data-label', n.label);
    g.setAttribute('transform', `translate(${n.x + PAD}, ${n.depth * LEVEL_H + PAD})`);
    g.style.cursor = n.children.length ? 'pointer' : 'default';
    if (n.children.length) {
      g.addEventListener('click', () => { n.collapsed = !n.collapsed; render(); });
    }

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', NODE_W);
    rect.setAttribute('height', n.height);
    rect.setAttribute('fill', c.fill);
    rect.setAttribute('stroke', c.stroke);
    g.appendChild(rect);

    const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    title.setAttribute('x', 12);
    title.setAttribute('y', 22);
    title.setAttribute('fill', c.text);
    title.setAttribute('class', 'title');
    title.textContent = n.label + (n.children.length ? '  ▸' : '');
    g.appendChild(title);

    const loc = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    loc.setAttribute('x', NODE_W - 12);
    loc.setAttribute('y', 22);
    loc.setAttribute('text-anchor', 'end');
    loc.setAttribute('fill', '#5c6b7f');
    loc.setAttribute('class', 'attr');
    loc.textContent = n.loc;
    g.appendChild(loc);

    if (!n.collapsed) {
      n.attrs.forEach((a, i) => {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', 12);
        t.setAttribute('y', 42 + i * 15);
        t.setAttribute('class', 'attr');
        t.setAttribute('fill', '#8b98a9');
        t.textContent = a.length > 26 ? a.slice(0, 25) + '…' : a;
        g.appendChild(t);
      });
    }
    svg.appendChild(g);
  }

  stage.appendChild(svg);

  const count = (function c(n){ return 1 + n.children.reduce((s,ch)=>s+c(ch),0); })(root);
  document.getElementById('meta').textContent = `节点 ${count} 个 · 深度 ${maxDepth + 1} 层`;
}

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.node').forEach(g => {
    const hit = q && g.getAttribute('data-label').toLowerCase().includes(q);
    g.classList.toggle('hit', !!hit);
    g.classList.toggle('dim', !!q && !hit);
  });
});
document.getElementById('collapse').addEventListener('click', () => {
  const root = build(AST);
  (function walk(n, d) { if (d >= 2) n.collapsed = true; n.children.forEach(c => walk(c, d + 1)); })(root, 0);
  window.__forced = root;
  render();
});
document.getElementById('expand').addEventListener('click', render);

render();
if (SOURCE) {
  const pre = document.createElement('pre');
  pre.className = 'src';
  pre.textContent = SOURCE;
  document.getElementById('stage').prepend(pre);
}
</script>
